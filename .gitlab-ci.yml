# Meridian CI — Gauntlet Labs GitLab (labs.gauntletai.com)
# Ladder: localnet (this pipeline) → devnet staging → Railway staging → Railway prod
# See docs/DEPLOY.md

stages:
  - build
  - test

variables:
  SOLANA_VERSION: "2.1.0"
  ANCHOR_VERSION: "0.31.1"
  AVM_VERSION: "0.31.1"
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  RUSTUP_HOME: "${CI_PROJECT_DIR}/.rustup"
  PATH: "${CI_PROJECT_DIR}/.cargo/bin:${CI_PROJECT_DIR}/.avm/bin:${CI_PROJECT_DIR}/.local/share/solana/install/active_release/bin:${PATH}"

cache:
  key: "${CI_COMMIT_REF_SLUG}-solana-${SOLANA_VERSION}-anchor-${ANCHOR_VERSION}"
  paths:
    - .cargo/bin/
    - .cargo/registry/
    - .cargo/git/
    - .rustup/
    - .avm/
    - .local/share/solana/
    - target/
    - node_modules/

.toolchain: &toolchain
  before_script:
    - |
      set -euo pipefail
      if ! command -v rustc >/dev/null 2>&1; then
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
        source "$CARGO_HOME/env" || true
      fi
      export PATH="$CARGO_HOME/bin:$PATH"
      if ! command -v solana >/dev/null 2>&1; then
        sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
      fi
      export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
      if ! command -v avm >/dev/null 2>&1; then
        cargo install --git https://github.com/coral-xyz/anchor avm --locked --force || cargo install --git https://github.com/coral-xyz/anchor avm --force
      fi
      mkdir -p "$CI_PROJECT_DIR/.avm/bin"
      export PATH="$CI_PROJECT_DIR/.avm/bin:$HOME/.avm/bin:$PATH"
      avm install ${AVM_VERSION} || true
      avm use ${AVM_VERSION} || true
      node -v || (curl -fsSL https://deb.nodesource.com/setup_20.x | bash - && apt-get install -y nodejs)
      yarn -v || npm i -g yarn
      yarn install --frozen-lockfile || yarn install

# ---------------------------------------------------------------------------
# Prod build (NO localnet-test) — fail if fixtures leak into .so / prod IDL
# ---------------------------------------------------------------------------
prod-build-no-fixtures:
  stage: build
  <<: *toolchain
  script:
    - export PATH="$CARGO_HOME/bin:$HOME/.local/share/solana/install/active_release/bin:$HOME/.avm/bin:$PATH"
    - |
      echo "FORBIDDEN on this job: --features localnet-test"
      yarn build:prod
    - bash scripts/assert-prod-no-fixtures.sh target/deploy/meridian.so idl/meridian.prod.json
  artifacts:
    paths:
      - target/deploy/meridian.so
      - idl/meridian.prod.json
    expire_in: 7 days
  allow_failure: false
  # If GitLab has no runner attached, this job stays pending — file still lands for when runners exist.
  tags: []

# ---------------------------------------------------------------------------
# Localnet suite: P0 / P1 / SIM (when present) behind localnet-test
# ---------------------------------------------------------------------------
localnet-anchor-test:
  stage: test
  <<: *toolchain
  script:
    - export PATH="$CARGO_HOME/bin:$HOME/.local/share/solana/install/active_release/bin:$HOME/.avm/bin:$PATH"
    - anchor test -- --features localnet-test
  artifacts:
    when: always
    paths:
      - target/deploy/meridian.so
    expire_in: 3 days
  allow_failure: false
  tags: []
