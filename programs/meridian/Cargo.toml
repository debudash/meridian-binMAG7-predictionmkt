[package]
name = "meridian"
version = "0.1.0"
description = "Meridian binary Yes/No equity markets (Peak6)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "meridian"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
# Deploy blocker: fixture ixs compile into the .so ONLY when this feature is set.
# Production / mainnet: `anchor build` (no features) — fixtures absent from BPF binary.
# Localnet suite: `anchor test -- --features localnet-test`
localnet-test = []
# IDL generation enables localnet-test so #[cfg] entrypoints typecheck during `anchor idl build`.
# The BPF .so is built separately without this feature unless cargo args request it.
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "localnet-test"]

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
