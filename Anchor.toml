# Minimal Anchor workspace stub — Engineers replace program id + paths when scaffolding
# programs/meridian (see programs/meridian/README.md). Testers own failing tests (D-016).
[toolchain]
anchor_version = "0.30.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
meridian = "Meridian11111111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
