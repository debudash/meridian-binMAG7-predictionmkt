[toolchain]
anchor_version = "0.31.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
meridian = "GwTvo6yNrGc8FS8cRYi1wbqcynVyWgkQssZ2vyYnxxo2"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# Program must be built with localnet-test so fixture ixs exist for the suite.
test = "yarn run mocha -r ts-node/register -t 180000 'tests/**/*.ts'"
